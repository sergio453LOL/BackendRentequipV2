spring.datasource.url=jdbc:h2:mem:rentequip;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

logging.level.com.rentequip.backend=WARN

rentequip.security.jwt.secret=test-only-signing-secret-for-the-rentequip-suite
rentequip.security.jwt.access-token-minutes=60
rentequip.security.google.client-id=test-client.apps.googleusercontent.com
rentequip.security.jwt.session-hours=8
# Platform admin of the category tests; every other test ADMIN only manages its own company.
rentequip.platform.admin-emails=admin@categories.pe,platform@rentequip.test,verifier@rentequip.test
# Every MockMvc request comes from 127.0.0.1 and the suite registers many companies: the per-IP limits are
# raised so they never interfere; AbuseLimitsTest checks the per-email and per-IP rules on their own.
rentequip.limits.login.failures-per-email=5
rentequip.limits.login.failures-per-ip=1000
rentequip.limits.register.per-ip-per-hour=100000
rentequip.limits.identity.per-ip-per-hour=3

# Las pruebas no hablan con ningun SMTP: el servicio registra y no envia.
rentequip.mail.enabled=false
rentequip.mail.from=no-reply@rentequip.test
spring.mail.host=localhost
spring.mail.port=1025

rentequip.cors.allowed-origins=http://localhost:*,https://*.vercel.app
rentequip.uploads.dir=target/test-uploads
rentequip.assistant.gemini.api-key=
rentequip.assistant.gemini.model=gemini-3.5-flash-lite
rentequip.assistant.limits.per-user-per-minute=5
rentequip.assistant.limits.per-user-per-hour=30
rentequip.assistant.limits.global-per-day=500
rentequip.assistant.api-key=
rentequip.assistant.model=claude-opus-5-5
server.forward-headers-strategy=framework

# Las pruebas nunca llaman a Stripe: sin clave se usa la pasarela simulada.
rentequip.payments.stripe.secret-key=

# Las pruebas nunca llaman a Twilio.
rentequip.twilio.account-sid=
rentequip.twilio.api-key-sid=
rentequip.twilio.api-key-secret=
rentequip.twilio.auth-token=
rentequip.twilio.whatsapp-from=
rentequip.whatsapp-empresas.base-url=http://localhost:0
rentequip.whatsapp-empresas.access-token=
rentequip.sms-gateway.base-url=
rentequip.sms-gateway.api-key=
rentequip.sms-gateway.sims=
rentequip.exchange.url=
rentequip.exchange.usd-pen-fallback=3.75
rentequip.identity.base-url=
rentequip.identity.free-url=
rentequip.identity.token=
rentequip.identity.apisperu-url=
rentequip.identity.apisperu-token=
