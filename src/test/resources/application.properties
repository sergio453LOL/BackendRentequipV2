spring.datasource.url=jdbc:h2:mem:rentequip;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

logging.level.com.rentequip.backend=WARN

rentequip.security.jwt.secret=test-only-signing-secret-for-the-rentequip-suite
rentequip.security.jwt.access-token-minutes=60
rentequip.security.jwt.refresh-token-days=7

# Las pruebas no hablan con ningun SMTP: el servicio registra y no envia.
rentequip.mail.enabled=false
rentequip.mail.from=no-reply@rentequip.test
spring.mail.host=localhost
spring.mail.port=1025
