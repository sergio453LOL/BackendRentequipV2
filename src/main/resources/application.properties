spring.application.name=rentequip-backend
# Claves locales (STRIPE_SECRET_KEY, etc.) en un .env junto al pom.xml, que no se sube a GitHub.
# En AWS no existe ese archivo y las variables llegan como variables de entorno.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentequip}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# Signing key for the JWT tokens. The default exists only so the project boots in development:
# it MUST be overridden with the JWT_SECRET environment variable in any deployed environment.
rentequip.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
rentequip.security.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
rentequip.security.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# Correo. Por defecto apunta a Mailpit, el SMTP de captura que levanta docker-compose:
# los mensajes no salen a internet y se leen en http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
rentequip.mail.enabled=${MAIL_ENABLED:true}
rentequip.mail.from=${MAIL_FROM:no-reply@rentequip.pe}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Solo el health check queda expuesto; el resto de endpoints de actuator no.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El correo es best-effort: EmailService ya traga sus fallos. Sin esto, un SMTP
# inalcanzable dejaria /actuator/health en DOWN con la API funcionando bien.
management.health.mail.enabled=false

server.port=${PORT:8080}
# Detras de Caddy (HTTPS) la app recibe HTTP: con esto respeta X-Forwarded-Proto/Host y las URLs que
# genera, como las de las fotos, salen con https:// y no provocan contenido mixto en la web.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
server.error.include-message=never
server.error.include-stacktrace=never

spring.web.resources.add-mappings=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.rentequip.backend=INFO

# Origenes que pueden llamar a la API desde el navegador (web local y despliegues en Vercel).
# Para otro dominio: CORS_ALLOWED_ORIGINS=http://localhost:*,https://*.vercel.app,https://mi-dominio.com
rentequip.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app}

# Fotos de maquinaria subidas desde la web. En AWS conviene montar aqui un volumen persistente (o usar S3).
rentequip.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Asistente de IA. Sin ANTHROPIC_API_KEY el asistente responde con el buscador local del catalogo.
rentequip.assistant.api-key=${ANTHROPIC_API_KEY:}
rentequip.assistant.model=${ASSISTANT_MODEL:claude-opus-5-5}

# Catálogo de demostración (maquinaria y herramientas con fotos). Se carga una sola vez al arrancar.
# DEMO_PASSWORD crea un administrador por empresa dueña; sin él, las empresas no tienen login.
rentequip.demo-data.enabled=${DEMO_DATA_ENABLED:false}
rentequip.demo-data.password=${DEMO_PASSWORD:}

# Pagos con Stripe (modo test: sk_test_...). Sin STRIPE_SECRET_KEY se usa la pasarela simulada.
rentequip.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}

# WhatsApp por Twilio (comprobantes). API key (SK...) + secreto; sin ellos el envío por WhatsApp responde 503.
rentequip.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
rentequip.twilio.api-key-sid=${TWILIO_API_KEY_SID:}
rentequip.twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
# Alternativa a la API key: el Auth Token de la cuenta (si está, se usa este).
rentequip.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
rentequip.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# WhatsApp Empresas (panel.whatsappempresas.com > Dispositivos). Si hay API key, se usa en lugar de Twilio.
rentequip.whatsapp-empresas.base-url=${WHATSAPP_EMPRESAS_URL:https://api.whatsappempresas.com}
rentequip.whatsapp-empresas.access-token=${WHATSAPP_EMPRESAS_TOKEN:}
