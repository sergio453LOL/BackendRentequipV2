<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${code} + ' es tu código de RentEquip'">Código de verificación</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:20px 24px;background:#0f172a;border-radius:8px 8px 0 0;">
            <img src="cid:rentequip-logo" width="40" height="40" alt="" style="vertical-align:middle;border-radius:8px;margin-right:10px;">
            <span style="color:#ffffff;font-size:20px;font-weight:bold;vertical-align:middle;">Rent<span style="color:#f59e0b;">Equip</span></span>
        </td>
    </tr>
    <tr>
        <td style="height:4px;background:#f59e0b;"></td>
    </tr>
    <tr>
        <td style="padding:24px;">
            <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                Hola <strong th:text="${name}">Ana</strong>, usa este código para <span th:text="${action}">iniciar sesión</span>:
            </p>
            <p style="margin:0 0 16px;font-size:34px;font-weight:bold;letter-spacing:8px;font-family:'Courier New',monospace;" th:text="${code}">123456</p>
            <p style="margin:0 0 8px;font-size:14px;color:#616e7c;">
                Vence en <span th:text="${minutes}">10</span> minutos. No lo compartas con nadie: RentEquip nunca te lo pedirá.
            </p>
            <p style="margin:0;font-size:14px;color:#616e7c;">Si no fuiste tú, cambia tu contraseña.</p>
        </td>
    </tr>
</table>
</body>
</html>
