<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(titulo, saludo, mensaje)">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">RentEquip</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:20px 24px;background:#1f2933;border-radius:8px 8px 0 0;">
            <span style="color:#ffffff;font-size:18px;font-weight:bold;">RentEquip</span>
        </td>
    </tr>
    <tr>
        <td style="padding:24px;">
            <h1 style="margin:0 0 12px;font-size:19px;" th:text="${titulo}">Título</h1>
            <p style="margin:0 0 8px;font-size:15px;" th:text="${saludo}">Hola</p>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.5;" th:text="${mensaje}">Mensaje</p>

            <table role="presentation" width="100%" style="border-collapse:collapse;font-size:14px;">
                <tr>
                    <td style="padding:8px 0;color:#616e7c;">Maquinaria</td>
                    <td style="padding:8px 0;text-align:right;" th:text="${reservation.equipmentName()}">Equipo</td>
                </tr>
                <tr>
                    <td style="padding:8px 0;color:#616e7c;">Arrendatario</td>
                    <td style="padding:8px 0;text-align:right;" th:text="${reservation.renterCompanyName()}">Empresa</td>
                </tr>
                <tr>
                    <td style="padding:8px 0;color:#616e7c;">Fechas</td>
                    <td style="padding:8px 0;text-align:right;">
                        <span th:text="${#temporals.format(reservation.startDate(), 'dd/MM/yyyy')}">inicio</span>
                        &ndash;
                        <span th:text="${#temporals.format(reservation.endDate(), 'dd/MM/yyyy')}">fin</span>
                        (<span th:text="${reservation.totalDays()}">0</span> días)
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 0;color:#616e7c;">Estado</td>
                    <td style="padding:8px 0;text-align:right;" th:text="${reservation.status()}">ESTADO</td>
                </tr>
                <tr style="border-top:1px solid #e4e7eb;">
                    <td style="padding:12px 0 0;font-weight:bold;">Total</td>
                    <td style="padding:12px 0 0;text-align:right;font-weight:bold;">
                        <span th:text="${reservation.currency()}">PEN</span>
                        <span th:text="${#numbers.formatDecimal(reservation.totalAmount(), 1, 2)}">0.00</span>
                    </td>
                </tr>
            </table>

            <p th:if="${reason != null and !reason.isEmpty()}"
               style="margin:20px 0 0;padding:12px;background:#f4f5f7;border-radius:6px;font-size:14px;">
                <strong>Motivo:</strong> <span th:text="${reason}">motivo</span>
            </p>

            <p style="margin:24px 0 0;font-size:12px;color:#7b8794;">
                Reserva #<span th:text="${reservation.reservationId()}">0</span> &middot;
                Este es un mensaje automático, no respondas a este correo.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
